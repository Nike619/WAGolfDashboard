name: Update tee times

on:
  schedule:
    - cron: '50 13 * * *'   # 6:50 AM Pacific in summer (5:50 AM in winter)
    - cron: '5 15 * * *'    # 8:05 AM Pacific: second pass for rate-limited booking sites
  workflow_dispatch:        # "Run workflow" button = check now
  push:
    branches: [main]
    paths: ['data/courses.json', 'index.html', 'src/**', 'styles/**', 'scripts/**', '.github/workflows/update.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tee-sheet
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # A push that only changes the page (index.html, src/, styles/) just redeploys; it doesn't spend the booking sites' rate limits.
      - name: Decide whether to check courses
        id: scope
        run: |
          fetch=true
          if [ "${{ github.event_name }}" = "push" ] && git fetch --depth=1 origin "${{ github.event.before }}" 2>/dev/null; then
            git diff --name-only "${{ github.event.before }}" HEAD | grep -qE '^(data/courses\.json|scripts/|\.github/workflows/update\.yml)' || fetch=false
          fi
          echo "fetch=$fetch" >> "$GITHUB_OUTPUT"
          echo "Check courses: $fetch"

      - name: Fetch tee times and rain
        if: steps.scope.outputs.fetch == 'true'
        run: node scripts/fetch.mjs
        continue-on-error: true

      - name: Get the latest data
        if: steps.scope.outputs.fetch != 'true'
        run: git pull --ff-only origin main || true

      - name: Save data to the repo
        if: steps.scope.outputs.fetch == 'true'
        run: |
          git config user.name "tee-sheet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update tee times $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin main
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
