name: Update tee times

on:
  schedule:
    - cron: '50 13 * * *'   # 6:50 AM Pacific in summer (5:50 AM in winter)
    - cron: '5 15 * * *'    # 8:05 AM Pacific: second pass for rate-limited booking sites
  workflow_dispatch:        # "Run workflow" button = check now
  push:
    branches: [main]
    paths: ['data/courses.json', 'index.html', 'scripts/**', '.github/workflows/update.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tee-sheet
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch tee times and rain
        run: node scripts/fetch.mjs
        continue-on-error: true

      - name: Save data to the repo
        run: |
          git config user.name "tee-sheet-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update tee times $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin main
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
